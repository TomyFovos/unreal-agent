name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: '1'

jobs:
  go:
    runs-on: ubuntu-24.04
    # The latest Ubuntu job took 5m08s; leave room for cold builds and Python tests.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            internal/apigen/go.sum
      - name: Check native parser compiler
        run: cc --version
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: make test-ci check build
      - name: Test distribution scripts
        working-directory: scripts
        run: nice -n 19 python3 -m unittest discover -p 'test_*.py'

  harbor:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            internal/apigen/go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.17'
          enable-cache: true
      - run: make -C benchmarks/harbor test check build BUNDLE=../../bin/harbor/ci
      - run: make -C benchmarks/harbor smoke BUNDLE=../../bin/harbor/ci
      - run: docker build -t unreal-agent-ci .
      - run: docker run --rm unreal-agent-ci -h
