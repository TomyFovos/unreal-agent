name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: make test check
      - name: Test distribution scripts
        working-directory: scripts
        run: python3 -m unittest discover -p 'test_*.py'
      - name: Install GoReleaser 2.18.2
        shell: bash
        # GoReleaser 2.18.2 needs a newer Go than go.mod pins; let go fetch it.
        env:
          GOTOOLCHAIN: auto
        run: |
          GOBIN="$RUNNER_TEMP/goreleaser-bin" go install -ldflags='-X main.version=2.18.2' \
            github.com/goreleaser/goreleaser/v2@v2.18.2
          "$RUNNER_TEMP/goreleaser-bin/goreleaser" --version
      - name: Build common development kit
        id: kit
        shell: bash
        run: |
          make snapshot GORELEASER="$RUNNER_TEMP/goreleaser-bin/goreleaser" | tee "$RUNNER_TEMP/snapshot.log"
          snapshot_archive=$(sed -n 's/^snapshot verified: //p' "$RUNNER_TEMP/snapshot.log")
          python3 scripts/common_development_bundle.py --snapshot "$snapshot_archive" \
            --revision "$GITHUB_SHA" | tee "$RUNNER_TEMP/kit.log"
          kit_archive=$(sed -n 's/^kit: //p' "$RUNNER_TEMP/kit.log")
          (cd "$(dirname "$kit_archive")" && sha256sum --check "$(basename "$kit_archive").sha256")
          echo "archive=$kit_archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release
          path: |
            ${{ steps.kit.outputs.archive }}
            ${{ steps.kit.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check *.tar.gz.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          # A tag with a suffix such as v1.1.0-rc.1 is a pre-release.
          prerelease=()
          [[ "$RELEASE_TAG" == *-* ]] && prerelease=(--prerelease)
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes "${prerelease[@]}"
